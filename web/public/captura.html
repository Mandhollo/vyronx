</style>

: {contact}", "es": "Compartido por: {contact}"}, "meta_title": {"pt": "VyronX · Guia Grátis: Como Comprar na Fase 2 da Presale (Passo a Passo para Iniciantes)", "en": "VyronX · Free Guide: How to Buy in Presale Phase 2 (Step by Step for Beginners)", "es": "VyronX · Guía Gratis: Cómo Comprar en la Fase 2 de la Presale (Paso a Paso para Principiantes)"}, "meta_desc": {"pt": "Baixe o guia gratuito e aprenda a comprar $VYR na Fase 2, a última antes da listagem a $0.03, mesmo que você nunca tenha comprado criptomoeda. Token deflacionário com buyback & burn.", "en": "Download the free guide and learn how to buy $VYR in Phase 2, the last one before the $0.03 listing, even if you have never bought crypto. Deflationary token with buyback & burn.", "es": "Descarga la guía gratis y aprende a comprar $VYR en la Fase 2, la última antes del listado a $0.03, aunque nunca hayas comprado cripto. Token deflacionario con buyback & burn."}, "d_img_caption": {"pt": "Infográfico oficial: token deflacionário VyronX. Queima automática, oferta caindo, valor subindo", "en": "Official infographic: VyronX deflationary token. Automatic burns, supply down, value up", "es": "Infografía oficial: token deflacionario VyronX. Quemas automáticas, oferta bajando, valor subiendo"}};
  var IMG={pt:'/captura-defl-pt.webp',en:'/captura-defl-en.webp',es:'/captura-defl-en.webp'};

  // idioma: ?lang= > localStorage > navegador
  var lang=(QS.get('lang')||'').toLowerCase();
  if(['pt','en','es'].indexOf(lang)===-1){
    lang='pt';
    try{var sl=localStorage.getItem('vx-captura-lang');if(['pt','en','es'].indexOf(sl)>-1)lang=sl;}catch(e){}
    var nav=(navigator.language||'').toLowerCase();
    if(nav.indexOf('es')===0)lang='es';else if(nav.indexOf('pt')!==0)lang='en';
  }
  try{localStorage.setItem('vx-captura-lang',lang)}catch(e){}
  document.documentElement.lang=lang==='en'?'en':lang==='es'?'es':'pt-BR';

  function tr(k){var e=T[k];return e?e[lang]||e.pt:''}
  function fmt(s,m){return s.replace('{lang}',m||'')}

  document.querySelectorAll('[data-t]').forEach(function(el){el.textContent=tr(el.getAttribute('data-t'))});
  document.querySelectorAll('[data-t-html]').forEach(function(el){el.innerHTML=tr(el.getAttribute('data-t-html'))});

  // h1 composto
  var h1=document.querySelector('h1[data-t-html="h1"]');
  if(h1){h1.innerHTML=tr('h1a')+' <span class="gold">'+tr('h1b')+'</span>. '+tr('h1c')}
  var sub=document.querySelector('.sub[data-t-html="sub"]');
  if(sub){sub.innerHTML=tr('sub1')+' <strong>'+tr('sub2')+': '+tr('sub3')+'</strong> <strong>'+tr('sub4')+'</strong>'+tr('sub5')+' <strong>'+tr('sub6')+'</strong>'+tr('sub7')}

  // d_h2 composto
  var dh2=document.querySelector('h2[data-t-html="d_h2"]');
  if(dh2){dh2.innerHTML=tr('d_h2a')+' <span class="gold">'+tr('d_h2b')+'</span>'}

  // placeholders + labels de input
  var nameInput=document.getElementById('fname');
  if(nameInput){nameInput.placeholder=tr('ph_name')}
  var mailInput=document.getElementById('femail');
  if(mailInput){mailInput.placeholder=tr('ph_email')}

  // imagem do infográfico por idioma
  var di=document.getElementById('deflImg');
  if(di){di.src=IMG[lang];di.alt=tr('d_img_caption')}

  // legenda da figura
  var cap=document.querySelector('.defl-banner figcaption');
  if(cap){cap.textContent=tr('d_img_caption')}

  // switch buttons
  document.querySelectorAll('.lang-switch button').forEach(function(b){
    b.classList.toggle('on',b.getAttribute('data-lang')===lang);
    b.addEventListener('click',function(){
      var u=new URL(window.location);u.searchParams.set('lang',b.getAttribute('data-lang'));
      window.location=u.toString();
    });
  });

  // PASSO labels (mono)
  var steps=['PASSO 1','PASSO 2','PASSO 3'];
  var stepLbl={pt:steps,en:['STEP 1','STEP 2','STEP 3'],es:['PASO 1','PASO 2','PASO 3']};
  document.querySelectorAll('.step .snum').forEach(function(el,i){el.textContent=stepLbl[lang][i]});

  // referral: captura (first-touch, mesmo formato do site) + CTA presale
  var ref=QS.get('ref');
  var refOk=false;
  if(ref){
    var valid=ref.indexOf('0x')===0?ref.length===42:ref.length>=8;
    if(valid){
      refOk=true;
      try{
        if(!localStorage.getItem('vyronx-ref')){
          localStorage.setItem('vyronx-ref',JSON.stringify({ref:ref,ts:Date.now()}));
        }
      }catch(e){}
      var cta=document.getElementById('presaleCta');
      if(cta){cta.href='/presale?ref='+encodeURIComponent(ref)}
    }
  }

  // contato do patrocinador: ?c=base64 (texto livre) ou ?wa=numero
  var sponsorBox=document.getElementById('sponsorCta');
  var sponsor=null;
  var c=QS.get('c');
  if(c){
    try{
      sponsor=decodeURIComponent(escape(atob(c.replace(/-/g,'+').replace(/_/g,'/'))));
    }catch(e){sponsor=null}
  }
  if(!sponsor){
    var wa=QS.get('wa');
    if(wa&&/^[0-9+\s-]{8,20}$/.test(wa))sponsor='WhatsApp: +'+wa.replace(/[^0-9]/g,'');
  }
  var sponsorLink=null;
  if(sponsor){
    var waNum=sponsor.match(/\+?[0-9][0-9\s\-]{7,18}/);
    if(waNum){
      var clean='+'+waNum[0].replace(/[^0-9]/g,'');
      sponsorLink='https://wa.me/'+clean.replace('+','');
      sponsor='WhatsApp '+clean;
    } else if(sponsor.indexOf('t.me/')>-1){
      sponsorLink='https://t.me/'+sponsor.split('t.me/')[1].split(/[\s?]/)[0];
    }
  }
  if(sponsor&&sponsorBox){
    sponsorBox.style.display='block';
    var title=tr('contact_title');
    var label=tr('contact_ph');
    sponsorBox.innerHTML='<div class="st">'+title+'</div>'+
      (sponsorLink?'<a href="'+sponsorLink+'" target="_blank" rel="noopener">💬 '+label+' · '+escapeHtml(sponsor)+'</a>'
                  :'<div style="color:var(--beige);font-size:.95rem">'+escapeHtml(sponsor)+'</div>');
  }
  function escapeHtml(s){return s.replace(/[&<>"']/g,function(ch){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}

  // título da aba
  document.title=tr('meta_title');
  var md=document.querySelector('meta[name="description"]');
  if(md){md.setAttribute('content',tr('meta_desc'))}

  // ===== Áudio de boas-vindas + portão de entrada (um áudio por idioma) =====
  var AUDIO={pt:'/captura-voice-pt.m4a',en:'/captura-voice-en.m4a',es:'/captura-voice-es.m4a'};
  var A=new Audio(AUDIO[lang]||AUDIO.pt);

  var gbtn=document.getElementById('gateBtn');
  if(gsub){gsub.textContent=tr('gate_sub')}
  if(gbtn){gbtn.textContent=tr('gate_btn')}
  function openGate(){
    if(gate){gate.style.opacity='0';setTimeout(function(){gate.style.display='none'},480)}
  }
  function startAudio(){A.play().then(openGate,openGate)}
  if(gbtn){gbtn.addEventListener('click',startAudio)}
  // tenta autoplay imediato; se o navegador bloquear, porta de entrada com 1 clique garante o áudio
  A.play().then(openGate,function(){if(gate){gate.classList.add('show')}});


  // form
  var form=document.getElementById('leadForm');
  var btn=document.getElementById('submitBtn');
  var err=document.getElementById('formError');
  var ok=document.getElementById('successBox');
  function showErr(msg){err.textContent=msg;err.style.display='block'}
  form.addEventListener('submit',function(e){
    e.preventDefault();
    err.style.display='none';
    var nome=form.nome.value.trim();
    var email=form.email.value.trim();
    if(nome.length<2){showErr(tr('err_name'));return}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){showErr(tr('err_email'));return}
    btn.disabled=true;btn.textContent=tr('sending');
    fetch('https://formsubmit.co/ajax/contato@vyronx.io',{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({
        nome:nome,email:email,
        idioma:lang.toUpperCase(),
        referral:refOk?ref:'(direto)',
        contato_referral:sponsor||'(não informado)',
        _subject:'🚀 Novo lead · Guia Presale VyronX ['+lang.toUpperCase()+']',
        _template:'table',
        _captcha:'false',
        _honey:''
      })
    })
    .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json()})
    .then(function(){form.style.display='none';ok.style.display='block';if(sponsorBox)sponsorBox.style.display='block'})
    .catch(function(){
      btn.disabled=false;btn.textContent=tr('btn_lead');
      showErr(tr('err_send'));
    });
  });
})();
</script>
